 name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        run: |
          set -e
          HTML="$(ls *.html 2>/dev/null | head -1)"
          [ -n "$HTML" ] || { echo "::error::no .html game file in repo root"; exit 1; }
          echo "Using game file: $HTML"
          mkdir -p app/www
          cp "$HTML" app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "حصن الصقر" com.hisn.falcon --web-dir=www
          npx cap add android
          # أيقونة التطبيق: إن وُجدت icon-only.png و icon-foreground.png و icon-background.png في جذر المستودع
          if [ -f ../icon-only.png ]; then
            mkdir -p assets
            cp ../icon-only.png assets/
            [ -f ../icon-foreground.png ] && cp ../icon-foreground.png assets/
            [ -f ../icon-background.png ] && cp ../icon-background.png assets/
            npm install -D @capacitor/assets@3
            npx capacitor-assets generate --android
          fi
          npx cap sync android

      - name: Use fixed signing key (if present) and bump version
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "Using fixed debug.keystore from repo"
          else
            echo "::warning::debug.keystore not found in repo root - using a random key. The APK will NOT update over a previously installed build (uninstall first)."
          fi
          G=app/android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"
          grep -q "versionCode ${{ github.run_number }}" "$G" || { echo "::error::versionCode was not updated in build.gradle"; exit 1; }

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk hisn-alsaqr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hisn-alsaqr-apk
          path: hisn-alsaqr.apk

      - name: Publish as Release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: hisn-alsaqr.apk
