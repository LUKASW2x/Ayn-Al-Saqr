
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        run: |
          set -e
          HTML="$(ls *.html | head -1)"
          echo "Using game file: $HTML"
          mkdir -p app/www
          cp "$HTML" app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "حصن الصقر" com.hisn.falcon --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk hisn-alsaqr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hisn-alsaqr-apk
          path: hisn-alsaqr.apk

      - name: Publish as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: hisn-alsaqr.apk
