 
name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          set -e
          HTML="$(ls *.html | head -1)"
          mkdir -p app/www
          cp "$HTML" app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "حصن الصقر" com.hisn.falcon --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/android/app/hisn-alsaqr.keystore
          test -s app/android/app/hisn-alsaqr.keystore

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs {" not in s:
              match = re.search(r'(?m)^(\s*)buildTypes\s*\{', s)
              if not match:
                  raise SystemExit("buildTypes not found")

              indent = match.group(1)
              block = '''
          ''' + indent + '''signingConfigs {
          ''' + indent + '''    release {
          ''' + indent + '''        storeFile file("hisn-alsaqr.keystore")
          ''' + indent + '''        storeType "PKCS12"
          ''' + indent + '''        storePassword System.getenv("KEYSTORE_PASSWORD")
          ''' + indent + '''        keyAlias System.getenv("KEY_ALIAS")
          ''' + indent + '''        keyPassword System.getenv("KEY_PASSWORD")
          ''' + indent + '''    }
          ''' + indent + '''}

          '''
              s = s[:match.start()] + block + s[match.start():]

          match = re.search(r'(?m)^(\s*)release\s*\{', s)
          if not match:
              raise SystemExit("release build type not found")

          indent = match.group(1) + "    "
          if "signingConfig signingConfigs.release" not in s:
              pos = match.end()
              s = s[:pos] + "\n" + indent + "signingConfig signingConfigs.release" + s[pos:]

          p.write_text(s)
          PY

      - name: Build signed APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk hisn-alsaqr.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisn-alsaqr-apk
          path: hisn-alsaqr.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: hisn-alsaqr.apk
