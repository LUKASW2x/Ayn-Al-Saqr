# build-apk
name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check game file and icons
        run: |
          set -e
          test -f index.html

          mkdir -p app/www app/assets
          cp index.html app/www/index.html

          # شاشة افتتاحية (اختيارية): splash.png في جذر المستودع
          sp="$(find . -maxdepth 1 -type f -iname 'splash.png' | head -1)"
          if [ -n "$sp" ]; then
            cp "$sp" app/assets/splash.png
            cp "$sp" app/assets/splash-dark.png
          else
            echo "WARNING: splash.png not found, skipping splash screen"
          fi

          # البحث عن الصور بغض النظر عن حالة الأحرف (png أو PNG)
          for n in icon-background icon-foreground icon-only; do
            f="$(find . -maxdepth 1 -type f -iname "$n.png" | head -1)"
            if [ -z "$f" ]; then
              echo "ERROR: missing $n.png in repository root"
              exit 1
            fi
            cp "$f" "app/assets/$n.png"
          done

          # التحقق من توافق الصور مع @capacitor/assets (PNG بحجم 1024x1024 على الأقل)
          python3 - <<'PY'
          import struct, sys
          ok = True
          for n in ("icon-background", "icon-foreground", "icon-only"):
              with open(f"app/assets/{n}.png", "rb") as fh:
                  head = fh.read(24)
              if head[:8] != b"\x89PNG\r\n\x1a\n":
                  print(f"ERROR: {n}.png is not a real PNG file")
                  ok = False
                  continue
              w, h = struct.unpack(">II", head[16:24])
              print(f"{n}.png -> {w}x{h}")
              if w < 1024 or h < 1024:
                  print(f"ERROR: {n}.png must be at least 1024x1024")
                  ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Create Android project
        working-directory: app
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/haptics@6 @capacitor/status-bar@6 @capacitor/splash-screen@6
          npx cap init "حصن الصقر" com.hisn.falcon --web-dir=www
          node -e "const fs=require('fs');const f='capacitor.config.json';if(!fs.existsSync(f)){console.log('config json not found, skipping splash config');process.exit(0)}const c=JSON.parse(fs.readFileSync(f,'utf8'));c.plugins=c.plugins||{};c.plugins.SplashScreen={launchShowDuration:1800,launchAutoHide:true,backgroundColor:'#0b1220',androidScaleType:'CENTER_CROP',showSpinner:false};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android

      - name: Generate icons
        working-directory: app
        run: |
          set -e
          npm install --save-dev @capacitor/assets
          npx capacitor-assets generate --android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/android/app/hisn-alsaqr.keystore
          test -s app/android/app/hisn-alsaqr.keystore

      - name: Configure release signing
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path("app/android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs" not in s:
              block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file(\"hisn-alsaqr.keystore\")\n"
                  "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")\n"
                  "            keyAlias System.getenv(\"KEY_ALIAS\")\n"
                  "            keyPassword System.getenv(\"KEY_PASSWORD\")\n"
                  "        }\n"
                  "    }\n"
              )
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)

          if "signingConfig signingConfigs.release" not in s:
              s = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  s,
                  count=1,
              )

          # رفع رقم الإصدار مع كل بناء ليقبل أندرويد التحديث فوق النسخة القديمة
          s = re.sub(r"versionCode\s+\d+", "versionCode " + os.environ["RUN_NUMBER"], s, count=1)

          assert "signingConfig signingConfigs.release" in s, "signing config was not added"
          p.write_text(s)
          print("build.gradle updated")
          PY

      - name: Build signed release APK
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature and show fingerprint
        run: |
          set -e
          APK="app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" hisn-alsaqr.apk
          APKSIGNER="$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose hisn-alsaqr.apk
          echo "---- Certificate fingerprint (public info) ----"
          keytool -printcert -jarfile hisn-alsaqr.apk | grep -E "SHA1|SHA256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisn-alsaqr-apk
          path: hisn-alsaqr.apk

      - name: Publish as Release (easy download from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: hisn-alsaqr.apk
